{% extends 'gestion/base.html' %}

{% block content %}
<h1 class="page-title">Eliminar factura</h1>
<p class="confirm-text">¿Confirma que desea eliminar la <strong>factura #{{ factura.id }}</strong> (orden {{ factura.orden.id }})?</p>
<form method="post">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="btn btn--primary">Sí, eliminar</button>
        <a class="btn btn--outline" href="{% url 'factura_lista' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
